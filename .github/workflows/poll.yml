name: poll
# NHL night (21-11 UTC = 00-14 Helsinki in summer time, 23-13 in winter): every 10 min, which covers
# night games for 6 h after the final horn (Mose's cadence). Daytime (12-20 UTC): every 30 min for
# afternoon games. GitHub may delay scheduled runs by 5-15 min. About 108 runs a day.
# Schedule re-registered 2026-10-10 17:2x after the Actions settings change.
on:
  schedule:
    - cron: '*/10 0-11 * * *'
    - cron: '*/10 21-23 * * *'
    - cron: '15,45 12-20 * * *'
  workflow_dispatch:
    inputs:
      hook_test:
        description: 'Dry run of the rebuild step: none = real hook; fail / ok = a public test endpoint (429 / 200) instead'
        default: none
        type: choice
        options: [none, fail, ok]
  # Also run once whenever the poller code or this workflow changes on main. This re-registers the
  # schedule and gives an immediate test run. The bot's own commits only touch koosteet.json, so no loop.
  push:
    branches: [main]
    paths: ['.github/workflows/poll.yml', 'poll.mjs', 'match.mjs']

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Poll NHL score feed and YouTube
        id: poll
        run: node poll.mjs

      - name: Commit koosteet.json
        id: commit
        if: steps.poll.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.poll.outputs.summary }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add koosteet.json
          git commit -m "koosteet: $SUMMARY"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Retries 3 times over about 1 minute (Retry-After honoured). A rebuild that still fails is kept in
      # deploy-state.json (pending: true), so the next run calls the hook even when koosteet.json is unchanged.
      # deploy-state.json is not in the push paths above, so its commits never trigger a run.
      - name: Rebuild the site (Vercel deploy hook, with retries)
        id: hook
        env:
          NEED: ${{ steps.commit.outputs.pushed == 'true' || inputs.hook_test == 'fail' }}
          HOOK: ${{ (inputs.hook_test == 'fail' && 'https://httpbin.org/status/429') || (inputs.hook_test == 'ok' && 'https://httpbin.org/status/200') || secrets.VERCEL_DEPLOY_HOOK }}
          HOOK_TRIES: '3'
          HOOK_WAIT_MS: ${{ (inputs.hook_test == 'fail' || inputs.hook_test == 'ok') && '2000' || '20000' }}
        run: node hook.mjs

      - name: Commit the rebuild state
        if: steps.hook.outputs.state_changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy-state.json
          git commit -m "deploy-state: rebuild ${{ steps.hook.outputs.ok == 'true' && 'done' || 'pending' }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      - name: Fail the run when the rebuild is still pending
        if: steps.hook.outputs.ok == 'false'
        run: |
          echo "::error::Vercel deploy hook failed after retries; deploy-state.json marks the rebuild pending for the next run."
          exit 1
